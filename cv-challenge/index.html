<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar Variation Challenge: Leaderboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='28' height='25' rx='6' fill='%23E6B53D'/%3E%3Crect x='2' y='5' width='28' height='8' rx='4' fill='%23C9930F'/%3E%3Crect x='8' y='2' width='3.2' height='7.5' rx='1.6' fill='%2313223F'/%3E%3Crect x='20.8' y='2' width='3.2' height='7.5' rx='1.6' fill='%2313223F'/%3E%3Cpath d='M18.26,16.46A6.00,6.00 0 1 0 18.26,26.54A5.04,5.04 0 1 1 18.26,16.46Z' fill='%2313223F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#15223A; --ink-2:#4A5772; --ink-3:#77839A;
  --line:#DCE2EB; --line-2:#E8ECF2;
  --night:#13223F; --night-2:#1C3157; --on-night:#F4F6FA; --on-night-2:#A9B6CC;
  --gold:#E6B53D; --gold-soft:#FBF1D6; --gold-ink:#8A630C;
  --silver:#BAC3CF; --bronze:#C4895A;
  --feb:#C98B10; --feb-bg:#F8EDCF; --feb-ink:#7C5508;
  --mar:#2F6DB0; --mar-bg:#DFEAF7; --mar-ink:#1F4E82;
  --oth:#8C96A8; --oth-bg:#E8ECF2; --oth-ink:#4A5772;
  --over:#7B5CC4; --under:#D2672A;
  --bench:#5B45B0; --bench-bg:#E9E3F8; --bench-ink:#45338F;
  --good:#1F7F52; --good-bg:#DDF2E7; --warn:#A86E07; --warn-bg:#FBEFD5; --bad:#B8402F; --bad-bg:#F8E0DB;
  --ram:rgba(230,181,61,.17); --ram-edge:rgba(201,139,16,.55);
  --stripe-a:rgba(110,92,196,.075); --stripe-b:rgba(110,92,196,.02); --ref-ink:#4D3F8F;
  --shadow:0 1px 2px rgba(19,34,63,.05),0 6px 18px rgba(19,34,63,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111C31; --surface-2:#17243E; --ink:#E6EBF3; --ink-2:#A9B5C9; --ink-3:#7C889F;
  --line:#22304B; --line-2:#1A2740;
  --night:#14264A; --night-2:#1D3560;
  --gold:#EDBE4C; --gold-soft:#2E2814; --gold-ink:#F0C860;
  --feb:#F0B83A; --feb-bg:#3A2E10; --feb-ink:#F4CB6A;
  --mar:#6FA6E0; --mar-bg:#142C4A; --mar-ink:#A3C8EF;
  --oth:#7D889C; --oth-bg:#1E2A40; --oth-ink:#B4BED0;
  --over:#A58BEA; --under:#F08B4F;
  --bench:#B4A0F0; --bench-bg:#271F45; --bench-ink:#CDBEF7;
  --good:#58C793; --good-bg:#11301F; --warn:#E9B04A; --warn-bg:#33270E; --bad:#EE7C6B; --bad-bg:#3A1A16;
  --ram:rgba(237,190,76,.12); --ram-edge:rgba(237,190,76,.5);
  --stripe-a:rgba(165,139,234,.1); --stripe-b:rgba(165,139,234,.03); --ref-ink:#C9B8F5;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.num,td,.tnum{font-variant-numeric:tabular-nums}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:var(--night);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 24px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.tools{display:flex;gap:8px;flex:none}
.brand svg{flex:none}
.tabs{display:flex;gap:2px;flex:1;align-self:stretch;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{appearance:none;border:0;background:none;color:#C3CDDF;font-weight:600;font-size:15px;padding:0 11px;display:flex;align-items:center;gap:7px;border-bottom:3px solid transparent;border-top:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab-btn svg{width:18px;height:18px;flex:none}
@media (max-width:1360px) and (min-width:1101px){.brand-txt{display:none}}
@media (max-width:1100px){
  .topbar-in{flex-wrap:wrap;height:auto;padding:10px 16px 0;gap:6px 14px}
  .brand{flex:1;font-size:17px}
  .tabs{order:3;flex-basis:100%;height:46px;margin:0 -8px}
  .tab-btn{padding:0 9px}
}
.tab-btn:hover{color:#fff}
.tab-btn[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold)}
.lang{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;color:#C3CDDF;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:#221A05}
.theme button{padding:5px 9px;display:grid;place-items:center}
.theme svg{width:16px;height:16px;display:block}

.wrap{max-width:1320px;margin:0 auto;padding:26px 24px 40px}
.view[hidden]{display:none}

/* hero */
.hero{position:relative;background:var(--night);color:#fff;border-radius:28px;overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.05)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:28px;padding:54px 56px 0;align-items:end}
.hero-text{align-self:center;padding-bottom:40px}
.hero h1{font-size:clamp(40px,5.1vw,70px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin:0 0 22px}
.hero .q{font-size:clamp(18px,1.75vw,23px);font-weight:500;color:#E6EBF4;margin:0 0 8px;max-width:30em}
.hero .course{color:var(--on-night-2);font-size:15px;margin:0 0 26px}
.hero .stats{font-size:17px;color:#D9E0EC;margin:0 0 28px;max-width:33em}
.hero .stats b{color:var(--gold);font-weight:800}
.btn-gold{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#201804;border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:16px;cursor:pointer;transition:transform .15s}
.btn-gold:hover{transform:translateY(-1px)}
.btn-gold:active{transform:translateY(1px)}
.btn-gold svg{width:20px;height:20px}

.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end;position:relative}
.podium::before{content:"";position:absolute;left:50%;top:-6%;width:420px;height:420px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(230,181,61,.2),transparent);z-index:-1;pointer-events:none}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .crown{width:46px;height:34px;margin-bottom:4px;color:var(--gold)}
.pod .av{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--night);display:grid;place-items:center;font-weight:800;font-size:27px;letter-spacing:-.02em;border:5px solid var(--silver)}
.pod.p1 .av{width:112px;height:112px;font-size:38px;border-color:var(--gold);box-shadow:0 0 0 9px rgba(230,181,61,.15)}
.pod.p3 .av{border-color:var(--bronze)}
.pod .nm{display:block;border:0;background:none;padding:0;cursor:pointer;color:#fff;font-weight:800;font-size:19px;line-height:1.2;margin-top:13px;text-wrap:balance}
.pod.p1 .nm{font-size:22px}
.pod .nm:hover{text-decoration:underline;text-underline-offset:3px}
.pod .nrp{color:var(--on-night-2);font-size:14px;margin-top:4px}
.pod .sc{font-weight:800;font-size:18px;margin:10px 0 18px;color:#D7DEEA}
.pod.p1 .sc{color:var(--gold);font-size:21px}
.pod.p3 .sc{color:#E4AC7E}
.page{position:relative;width:100%;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;padding-top:28px;color:var(--night);font-weight:800;font-size:66px;line-height:1;letter-spacing:-.04em}
.page::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:14px 14px 0 0;background:rgba(19,34,63,.17)}
.page .ring{position:absolute;top:-11px;width:9px;height:25px;border-radius:6px;background:#E3E8F0;border:2px solid var(--night)}
.page .ring.a{left:27%}.page .ring.b{right:27%}
.p1 .page{height:205px;background:var(--gold);font-size:86px}
.p2 .page{height:158px;background:var(--silver)}
.p3 .page{height:128px;background:var(--bronze)}
.pod.glow .av{animation:glow 1.1s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 18px rgba(230,181,61,.35);transform:scale(1.05)}}

.strip-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 56px 10px;color:var(--on-night-2);font-size:13.5px;font-weight:600}
.strip-head .rk{display:inline-flex;align-items:center;gap:7px;color:#F3D37E}
.strip{overflow-x:auto;scrollbar-width:thin}
.strip-in{position:relative;display:grid;grid-template-columns:repeat(11,minmax(58px,1fr));background:var(--gold);color:var(--night);min-width:640px}
.strip .cell{position:relative;min-height:82px;padding:10px 12px 10px;border-left:1px solid rgba(19,34,63,.2);display:flex;flex-direction:column;justify-content:space-between}
.strip .cell:first-child{border-left:0}
.strip .mo{font-size:13px;font-weight:700;opacity:.78}
.strip .val{font-size:23px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.strip .bar{position:absolute;right:12px;bottom:12px;width:9px;border-radius:3px;background:rgba(19,34,63,.3)}
.strip .cell.pk .bar{background:var(--night)}
.strip .ramb{position:absolute;top:0;bottom:0;background:rgba(19,34,63,.13);border-left:2px solid rgba(19,34,63,.55);border-right:2px solid rgba(19,34,63,.55);pointer-events:none}
.strip .ramb svg{position:absolute;top:8px;left:6px}

/* cards + panels */
.cards3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:22px}
.hl{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent,var(--gold));border-radius:18px;padding:22px 26px;box-shadow:var(--shadow)}
.hl .k{color:var(--ink-2);font-weight:600;font-size:15px}
.hl .who{font-weight:800;font-size:21px;line-height:1.25;margin-top:6px}
.hl .who button{border:0;background:none;padding:0;font-weight:800;cursor:pointer;text-align:left}
.hl .who button:hover{text-decoration:underline;text-underline-offset:3px}
.hl .sub{color:var(--ink-3);font-size:14px}
.hl .big{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px}
.hl .big b{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hl .big span{color:var(--ink-2);font-weight:600;font-size:14px}
.hl .ctx{color:var(--ink-2);font-size:14.5px;margin:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-top:22px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.panel-h p{margin:2px 0 0;color:var(--ink-2);font-size:14px;max-width:62em}
.panel-h .grow{flex:1;min-width:240px}
.panel-b{padding:18px 24px 22px}
.search,.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:240px;font-size:15px}
.search:focus,.sel:focus{outline:3px solid var(--gold);outline-offset:1px}
.sel{cursor:pointer;max-width:100%}

/* ranking table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse}
.rank{width:100%;min-width:940px}
.rank th{font-size:13.5px;font-weight:700;color:var(--ink-2);text-align:right;padding:12px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
.rank th.l,.rank td.l{text-align:left}
.rank th button{border:0;background:none;padding:2px 0;font-weight:700;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.rank th button:hover{color:var(--ink)}
.rank th[aria-sort] button{color:var(--ink)}
.rank th .arr{font-size:11px;opacity:.75}
.rank td{padding:13px 14px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
.rank tr:last-child td{border-bottom:0}
.rank td.off{background:var(--gold-soft)}
.rank th.off{background:var(--gold-soft);border-radius:10px 10px 0 0}
.rank td.off b{font-weight:800;font-size:16px}
.rk-badge{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;background:var(--surface-2);color:var(--ink);font-size:15px;border:1px solid var(--line)}
.rk-badge.t{font-size:13px}
.rk-badge.g{background:var(--gold);color:#251C04;border-color:transparent}
.rk-badge.s{background:var(--silver);color:#1B2638;border-color:transparent}
.rk-badge.b{background:var(--bronze);color:#2A1607;border-color:transparent}
.who-c .n{border:0;background:none;padding:0;font-weight:700;font-size:16px;cursor:pointer;text-align:left;color:var(--ink)}
.who-c .n:hover{text-decoration:underline;text-underline-offset:3px}
.who-c .id{color:var(--ink-3);font-size:13px}
.mr{color:var(--ink-3);font-size:12.5px;margin-left:7px;display:inline-block;min-width:2.4em;text-align:left}
.vs-good{color:var(--good);font-weight:700}
.vs-bad{color:var(--bad);font-weight:700}
tr.ref td{background:repeating-linear-gradient(135deg,var(--stripe-a) 0 10px,var(--stripe-b) 10px 20px);background-attachment:fixed}
tr.ref td.off{background:repeating-linear-gradient(135deg,var(--stripe-a) 0 10px,var(--stripe-b) 10px 20px),var(--gold-soft)}
tr.ref .n{font-style:italic;color:var(--ref-ink);cursor:default}
tr.ref .n:hover{text-decoration:none}
tr.ref .rk-badge{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-3)}
.empty{padding:28px 24px;color:var(--ink-2)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;line-height:1.5;white-space:nowrap}
.chip.feb{background:var(--feb-bg);color:var(--feb-ink)}
.chip.mar{background:var(--mar-bg);color:var(--mar-ink)}
.chip.other{background:var(--oth-bg);color:var(--oth-ink)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.gold{background:var(--gold);color:#251C04}
.chip.plain{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.st{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%}
.st svg{width:17px;height:17px}
.st.ok{color:var(--good);background:var(--good-bg)}
.st.note{color:var(--warn);background:var(--warn-bg)}
.st.rev{color:var(--bad);background:var(--bad-bg)}

/* charts */
.chart-host{position:relative;width:100%}
.chart{display:block;max-width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;font-size:12px;fill:var(--ink-2)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .zero{stroke:var(--ink-3);stroke-width:1.2}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .xtick{font-size:12.5px;font-weight:600;fill:var(--ink-2)}
.chart .ram-band{fill:var(--ram);stroke:var(--ram-edge);stroke-width:1;stroke-dasharray:3 3}
.chart .ram-lbl{font-size:11.5px;font-weight:700;fill:var(--feb-ink)}
.chart .ram-moon{fill:var(--feb)}
.sp{fill:none;stroke-width:1.6;stroke-linejoin:round;opacity:.42;transition:opacity .12s}
.sp-feb{stroke:var(--feb)}.sp-mar{stroke:var(--mar)}.sp-other{stroke:var(--oth)}
.dim .sp{opacity:.12}
.act-line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.act-dot{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.med-line{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:6 5}
.hl-line{fill:none;stroke-width:3.4;stroke-linejoin:round}
.hl-dot{stroke:var(--surface);stroke-width:2}
.box{fill:var(--surface-2);stroke:var(--ink-3);stroke-width:1.2}
.box-med{stroke:var(--ink);stroke-width:2.4}
.whisk{stroke:var(--ink-3);stroke-width:1.2}
.dot-over{fill:var(--over);opacity:.78}
.dot-under{fill:var(--under);opacity:.78}
.dot-over:hover,.dot-under:hover{opacity:1;stroke:var(--ink);stroke-width:1.5}
.bar-over{fill:var(--over)}.bar-under{fill:var(--under)}
.pt{stroke:var(--surface);stroke-width:1.6;cursor:pointer}
.pt-feb{fill:var(--feb)}.pt-mar{fill:var(--mar)}.pt-other{fill:var(--oth)}
.pt:hover{stroke:var(--ink);stroke-width:2}
.pt-count{font-size:10.5px!important;font-weight:800;fill:#fff!important;pointer-events:none}
.star{fill:var(--ink);stroke:var(--surface);stroke-width:1.5}
.ref-line{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:5 4}
.ref-lbl{font-size:11.5px!important;font-weight:700;fill:var(--ink-2)!important}
.diag{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 4}
.region{font-size:12.5px!important;font-weight:700}
.region.feb{fill:var(--feb-ink)!important}.region.mar{fill:var(--mar-ink)!important}
.diamond{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0 0 12px;color:var(--ink-2);font-size:13.5px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;background:currentColor}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--ink-3) 0 6px,transparent 6px 10px);height:2px}
.legend i.dot{width:11px;height:11px;border-radius:50%}
.legend i.band{width:18px;height:12px;border-radius:3px;background:var(--ram);border:1px dashed var(--ram-edge)}

/* tooltip */
.tip{position:fixed;z-index:60;pointer-events:none;background:#0F1C34;color:#F3F6FA;border-radius:11px;padding:9px 12px;font-size:13px;line-height:1.5;box-shadow:0 10px 28px rgba(0,0,0,.25);max-width:300px;border:1px solid rgba(255,255,255,.1)}
.tip b{font-weight:800}
.tip .m{color:#AEBBD2}
.tip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

/* months tab */
.heat{border-collapse:separate;border-spacing:3px;width:auto;min-width:900px}
.heat td:not(.nm){min-width:58px}
.heat th{font-size:12.5px;font-weight:700;color:var(--ink-2);padding:6px 4px;text-align:center;white-space:nowrap}
.heat th.l{text-align:left}
.heat td{font-size:12.5px;text-align:center;padding:7px 4px;border-radius:7px;white-space:nowrap}
.heat td.nm{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1;padding-right:12px}
.heat td.nm button{border:0;background:none;padding:0;cursor:pointer;font-weight:600;color:var(--ink)}
.heat td.nm button:hover{text-decoration:underline}
.heat td.nm .r{display:inline-block;width:2.2em;color:var(--ink-3);font-weight:700}
.heat td.sc{font-weight:800;background:var(--gold-soft)}
.heat tr.ram th.mo-ram{color:var(--feb-ink)}
.scale{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-weight:600;margin:0 0 12px;flex-wrap:wrap}
.scale .ramp{width:200px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--under),var(--surface-2) 50%,var(--over))}

/* compare tab */
.insight{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:20px;padding:26px 30px;box-shadow:var(--shadow)}
.insight h2{margin:0 0 10px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.insight p{margin:0 0 10px;color:var(--ink-2);font-size:15.5px;max-width:46em}
.insight p:last-child{margin-bottom:0}
.split{display:flex;flex-direction:column;gap:12px;justify-content:center}
.split-bar{display:flex;height:40px;border-radius:12px;overflow:hidden;font-weight:800;font-size:14px}
.split-bar div{display:flex;align-items:center;justify-content:center;min-width:28px}
.split-bar .feb{background:var(--feb);color:#241A03}
.split-bar .mar{background:var(--mar);color:#fff}
.split-bar .other{background:var(--oth);color:#fff}
.split-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.split-leg span{display:inline-flex;align-items:center;gap:7px}
.split-leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.split-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split-stats div{background:var(--surface-2);border-radius:12px;padding:10px 14px}
.split-stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.split-stats span{font-size:13px;color:var(--ink-2);font-weight:600}
.grid-cmp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
.grid-cmp>.col{display:flex;flex-direction:column;min-width:0}
.grid-cmp>.col>.panel:first-child{margin-top:22px}
.corr{width:100%;border-collapse:separate;border-spacing:4px}
.corr th{font-size:13px;color:var(--ink-2);font-weight:700;padding:6px}
.corr td{text-align:center;padding:10px 6px;border-radius:9px;font-weight:700}
.corr-note{margin:12px 0 0;color:var(--ink-2);font-size:14px}

/* profile tab */
.grid-prof{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.prof-card{padding:22px 26px 26px}
.prof-card label{display:block;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.prof-card .sel{width:100%}
.idrow{display:flex;align-items:center;gap:18px;margin-top:24px}
.idrow .av{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:30px;border:5px solid var(--line);flex:none;background:var(--surface-2)}
.idrow .av.g{border-color:var(--gold)}.idrow .av.s{border-color:var(--silver)}.idrow .av.b{border-color:var(--bronze)}
.idrow h3{margin:0;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.idrow .id{color:var(--ink-3);font-size:15px;margin-top:2px}
.bigrank{display:flex;align-items:baseline;gap:10px;margin:22px 0 2px}
.bigrank b{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:.95}
.bigrank span{color:var(--ink-2);font-size:17px;font-weight:600}
.prof-card .best{color:var(--ink-2);margin:0 0 16px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badges .chip{font-size:13.5px;padding:5px 12px}
.fileinfo{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.fileinfo .fn{font-weight:700;color:var(--ink);word-break:break-all}
.fileinfo ul{margin:6px 0 0;padding-left:18px}
.mt{width:100%}
.mt th{font-size:13.5px;color:var(--ink-2);font-weight:700;padding:12px 18px;border-bottom:2px solid var(--line);text-align:right;white-space:nowrap}
.mt th.l,.mt td.l{text-align:left}
.mt td{padding:12px 18px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
.mt tr.official td{background:var(--gold-soft)}
.mt tr.official td.v{font-weight:800;font-size:16px}
.mt tr.sep td{border-top:2px solid var(--line)}
.mt td.l .h{display:block;color:var(--ink-3);font-size:12.5px;font-weight:500}

/* submissions tab */
.stats5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 22px;box-shadow:var(--shadow)}
.stat .k{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:600;font-size:14.5px}
.stat .k svg{width:18px;height:18px}
.stat b{display:block;font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.stat .s{color:var(--ink-3);font-size:13px;margin-top:2px}
.stat.ok b{color:var(--good)}.stat.note b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.rules p{margin:0 0 10px;max-width:72em;color:var(--ink-2);font-size:15px}
.rules p:last-child{margin-bottom:0}
.grid-sub{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:22px;align-items:start}
.subt{width:100%;min-width:640px}
.subt th{font-size:13.5px;color:var(--ink-2);font-weight:700;text-align:left;padding:12px 14px;border-bottom:2px solid var(--line);white-space:nowrap}
.subt td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:14px}
.subt td .n{font-weight:700;font-size:15px;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.subt td .n:hover{text-decoration:underline}
.subt td .id{color:var(--ink-3);font-size:12.5px}
.subt .fn{font-size:12px;color:var(--ink-3);margin-top:3px;max-width:260px;overflow-wrap:anywhere}
.subt ul{margin:0;padding-left:16px;color:var(--ink-2)}
.subt li{margin:0 0 3px}
.subt li.warn{color:var(--bad);font-weight:600}
.subt .none{color:var(--ink-3)}
.nw{white-space:nowrap}
.ident{padding:4px 24px 22px}
.ident>p{color:var(--ink-2);font-size:14.5px;margin:16px 0}
.grp{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;background:var(--surface-2)}
.grp .hd{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.grp .meta{color:var(--ink-2);font-size:13.5px;font-weight:600;margin:6px 0 8px}
.grp .names{font-size:14px;line-height:1.55;display:grid;gap:3px}
.grp .names button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font-weight:600}
.grp .names button:hover{text-decoration:underline}
.grp .names .id{color:var(--ink-3)}
.subh{font-size:15px;font-weight:800;margin:24px 0 0}

/* benchmark tab */
.chip.bench{background:var(--bench-bg);color:var(--bench-ink)}
.ln-bench{fill:none;stroke:var(--bench);stroke-width:2.8;stroke-linejoin:round}
.dot-bench{fill:var(--bench);stroke:var(--surface);stroke-width:1.6}
.ln-snaive{fill:none;stroke:var(--mar);stroke-width:2.2;stroke-dasharray:8 5;stroke-linejoin:round}
.ln-naive{fill:none;stroke:var(--oth);stroke-width:2.4;stroke-dasharray:1 5;stroke-linecap:round}
.ln-train{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-linejoin:round}
.test-band{fill:var(--feb-bg);opacity:.7}
.test-lbl{font-size:11.5px!important;font-weight:700;fill:var(--feb-ink)!important}
.sq-bench{fill:var(--bench);stroke:var(--surface);stroke-width:1.6}
.sq-snaive{fill:var(--surface);stroke:var(--mar);stroke-width:2.4}
.hist-moon{fill:var(--feb)}
.bm-intro p{margin:0 0 10px;color:var(--ink-2);font-size:15px;max-width:78em}
.bm-intro p:last-child{margin-bottom:0}
.bm-tbl{min-width:900px}
.bm-tbl td.l .n{font-weight:700;font-size:15.5px}
.bm-tbl td.l .id{color:var(--ink-3);font-size:13px;white-space:normal;max-width:34em}
.bm-tbl .sw{display:inline-block;width:24px;height:4px;border-radius:2px;margin-right:10px;vertical-align:middle}
.yheat{border-collapse:separate;border-spacing:3px}
.yheat th{font-size:12.5px;font-weight:700;color:var(--ink-2);padding:4px 6px;text-align:center}
.yheat tbody th{vertical-align:middle}
.yheat th.yr{text-align:right;padding-right:12px;white-space:nowrap}
.yheat td{position:relative;min-width:52px;height:40px;text-align:center;vertical-align:bottom;font-size:12.5px;border-radius:6px;padding:0 4px 6px;color:var(--ink)}
.yheat td.pk{font-weight:800;box-shadow:inset 0 0 0 2px var(--ink)}
.yheat td.na{color:var(--ink-3);background:var(--surface-2)}
.yheat tr.test th.yr{color:var(--feb-ink)}
.yheat .rm{position:absolute;top:3px;transform:translateX(-50%);line-height:0;pointer-events:none}
.yheat .rm svg{width:11px;height:11px;fill:var(--ink)}
.yh-key{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:13px;color:var(--ink-2);font-weight:600;margin:0 0 12px}
.yh-key .ramp{width:160px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),rgba(230,181,61,.9))}
.foot{max-width:1320px;margin:0 auto;padding:0 24px 40px;color:var(--ink-3);font-size:13px}

@media (max-width:1180px){
  .hero-grid{padding:44px 36px 0}
  .strip-head{padding:18px 36px 10px}
  .stats5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-sub{grid-template-columns:1fr}
  .cards3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:10px}
  .hero-text{padding-bottom:16px}
  .grid-prof,.grid2,.grid-cmp,.insight{grid-template-columns:1fr}
}
@media (max-width:640px){
  .brand-txt{display:none}
  .strip-in{grid-template-columns:repeat(11,minmax(50px,1fr));min-width:560px}
  .strip .cell{padding:9px 8px;min-height:72px}
  .strip .val{font-size:19px}
  .strip .bar,.strip .ramb svg{display:none}
  .chart .xtick{font-size:10.5px}
  .wrap{padding:16px 12px 32px}
  .cards3{grid-template-columns:1fr}
  .hero{border-radius:22px}
  .hero-grid{padding:30px 20px 0}
  .strip-head{padding:16px 20px 8px}
  .podium{gap:8px}
  .pod .av{width:62px;height:62px;font-size:21px;border-width:4px}
  .pod.p1 .av{width:80px;height:80px;font-size:28px}
  .pod .nm{font-size:15px}.pod.p1 .nm{font-size:16.5px}
  .pod .nrp{font-size:12px}
  .pod .sc{font-size:14.5px}.pod.p1 .sc{font-size:16px}
  .p1 .page{height:150px;font-size:62px}.p2 .page{height:118px;font-size:50px}.p3 .page{height:98px;font-size:46px}
  .panel-h,.panel-b{padding-left:16px;padding-right:16px}
  .search,.sel{min-width:0;width:100%}
  .stats5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat b{font-size:34px}
  .insight{padding:22px 20px}
  .bigrank b{font-size:52px}
  .ident{padding:4px 16px 18px}
  .foot{padding:0 14px 30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70;display:none}
</style>

<main class="wrap" id="main">

const MON = {id:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};

const mNum = key => +key.slice(5, 7) - 1;
const mS = i => MON[lang][mNum(D.months[i])];
const mL = i => MONL[lang][mNum(D.months[i])];
const keyS = key => MON[lang][mNum(key)] + ' ' + key.slice(0, 4);
function upTime(s){ if (!s) return '–'; const [d, h] = s.split(' '); const [y, m, dd] = d.split('-'); return `${+dd} ${MON[lang][+m - 1]}, ${lang === 'id' ? h.replace(':', '.') : h}`; }

/* ---------------- model ---------------- */
function metrics(p){
  let se = 0, ae = 0, ape = 0, sape = 0, b = 0;
  for (let i = 0; i < N; i++){ const e = p[i] - A[i]; se += e*e; ae += Math.abs(e); ape += Math.abs(e) / Math.abs(A[i]); sape += 2 * Math.abs(e) / (Math.abs(A[i]) + Math.abs(p[i])); b += e; }
  return {rmse: Math.sqrt(se / N), mae: ae / N, mape: ape / N * 100, smape: sape / N * 100, bias: b / N};
}
function rmseRange(p, a, b){ let s = 0; for (let i = a; i < b; i++){ const e = p[i] - A[i]; s += e*e; } return Math.sqrt(s / (b - a)); }
const peakGroup = i => (i === 1 ? 'feb' : i === 2 ? 'mar' : 'other');
const ACT_PEAK = argmax(A);

const students = D.students.map((s, idx) => Object.assign({}, s, {idx, initials: initials(s.name), review: s.notes.some(n => n.sev === 'warn')}));
const ranked = students.filter(s => s.status !== 'invalid');
ranked.forEach(s => { s.m = metrics(s.pred); s.peakIdx = argmax(s.pred); s.peak = peakGroup(s.peakIdx); s.calm = rmseRange(s.pred, 3, N); s.r = {}; });
const METRICS = ['rmse', 'mae', 'mape', 'smape'];
METRICS.forEach(k => {
  const sorted = [...ranked].sort((a, b) => a.m[k] - b.m[k]); let prev = null, r = 0;
  sorted.forEach((s, i) => { const key = Math.round(s.m[k] * 1e4); if (key !== prev){ r = i + 1; prev = key; } s.r[k] = r; });
});
ranked.forEach(s => { s.tied = ranked.some(o => o !== s && o.r.rmse === s.r.rmse); });
const byRank = [...ranked].sort((a, b) => a.r.rmse - b.r.rmse || a.m.mae - b.m.mae || a.name.localeCompare(b.name));
const NR = ranked.length;

const ensMed = D.months.map((_, i) => median(ranked.map(s => s.pred[i])));

].map(r => { const m = metrics(r.pred); return Object.assign(r, {m, flat: Math.max(...r.pred) === Math.min(...r.pred), peakIdx: argmax(r.pred), wouldRank: ranked.filter(s => s.m.rmse < m.rmse).length + 1, beats: ranked.filter(s => s.m.rmse > m.rmse).length}); });

refs.forEach(r => { r.peak = peakGroup(r.peakIdx); });

const minBy = (arr, f) => { const v = Math.min(...arr.map(f)); return arr.filter(s => Math.abs(f(s) - v) < 1e-9); };
const bestSpike = minBy(ranked, s => Math.abs(s.pred[ACT_PEAK] - A[ACT_PEAK]));

// identical forecasts
const maxDiff = (a, b) => a.reduce((m, v, i) => Math.max(m, Math.abs(v - b[i])), 0);
const parent = ranked.map((_, i) => i);
const find = i => { while (parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
for (let i = 0; i < NR; i++) for (let j = i + 1; j < NR; j++) if (maxDiff(ranked[i].pred, ranked[j].pred) < 0.01) parent[find(i)] = find(j);
const gmap = {}; ranked.forEach((s, i) => { (gmap[find(i)] = gmap[find(i)] || []).push(s); });
const identical = Object.values(gmap).filter(g => g.length > 1).map(g => {
  let d = 0; for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) d = Math.max(d, maxDiff(g[i].pred, g[j].pred));
  g.sort((a, b) => a.name.localeCompare(b.name)); return {members: g, d, rmse: Math.min(...g.map(s => s.m.rmse))};
}).sort((a, b) => b.members.length - a.members.length || a.rmse - b.rmse);
const partial = [];
for (let i = 0; i < NR; i++) for (let j = i + 1; j < NR; j++){
  const a = ranked[i], b = ranked[j]; if (find(i) === find(j)) continue;
  const diffIdx = []; for (let k = 0; k < N; k++) if (Math.abs(a.pred[k] - b.pred[k]) >= 0.01) diffIdx.push(k);
  if (N - diffIdx.length >= 9) partial.push({a, b, same: N - diffIdx.length, diffIdx});
}

// Spearman between metric rankings
function avgRanks(v){ const o = v.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]), r = Array(v.length); let i = 0;
  while (i < o.length){ let j = i; while (j + 1 < o.length && Math.abs(o[j+1][0] - o[i][0]) < 1e-9) j++; for (let k = i; k <= j; k++) r[o[k][1]] = (i + j) / 2 + 1; i = j + 1; } return r; }
function pearson(x, y){ const n = x.length, mx = x.reduce((a, b) => a + b) / n, my = y.reduce((a, b) => a + b) / n; let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++){ sxy += (x[i]-mx)*(y[i]-my); sxx += (x[i]-mx)**2; syy += (y[i]-my)**2; } return sxy / Math.sqrt(sxx * syy); }
const RK = Object.fromEntries(METRICS.map(k => [k, avgRanks(ranked.map(s => s.m[k]))]));

/* ---------------- status + notes ---------------- */

  if (n.month) p.month = MONL[lang][mNum(n.month)];

}

/* ---------------- shared month-axis frame ---------------- */
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
function frac(ds, end){ const [y, mo, d] = ds.split('-').map(Number); const i = D.months.indexOf(`${y}-${String(mo).padStart(2, '0')}`); return i + (end ? d : d - 1) / dim(y, mo); }
const RAM = {f0: frac(D.ramadan.start, false), f1: frac(D.ramadan.end, true)};
const hostW = host => Math.max(300, Math.floor(host.getBoundingClientRect().width));
function monthFrame(host, o){
  host.innerHTML = '';
  const W = hostW(host), H = o.height || 340;
  const m = Object.assign({t: 30, r: 12, b: 34, l: 46}, o.margin || {});
  const iw = W - m.l - m.r, ih = H - m.t - m.b, bw = iw / N;
  const ticks = niceTicks(o.yMin, o.yMax, o.ticks || 5), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const dec = ticks.step >= 1 ? 0 : Math.ceil(-Math.log10(ticks.step));
  const svg = S('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H, class: 'chart', role: 'img', 'aria-label': o.label || ''}, host);
  const x = i => m.l + (i + .5) * bw, xf = f => m.l + f * bw, y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
  if (o.ramadan !== false){
    const g = S('g', {}, svg), rx = xf(RAM.f0), rw = xf(RAM.f1) - rx;
    S('rect', {x: rx, y: m.t - 4, width: rw, height: ih + 4, class: 'ram-band', rx: 4}, g);
    S('path', {d: crescentD(rx + 6, m.t - 15, 5.5), class: 'ram-moon'}, g);
    if (W - m.r - rx > 120) T(g, rx + 15, m.t - 11, t('ramadan'), 'ram-lbl');
  }
  ticks.forEach(v => { S('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: (v === 0 && o.zero) ? 'zero' : 'grid'}, svg); T(svg, m.l - 8, y(v) + 4, fmt(v, dec), 'ytick', 'end'); });
  for (let i = 0; i <= N; i++) S('line', {x1: xf(i), x2: xf(i), y1: m.t + ih, y2: m.t + ih + 5, class: 'axis'}, svg);
  D.months.forEach((_, i) => T(svg, x(i), H - m.b + 21, mS(i), 'xtick', 'middle'));
  return {svg, W, H, m, iw, ih, bw, x, xf, y, y0, y1, dec};
}
const pathD = (f, p) => p.map((v, i) => (i ? 'L' : 'M') + f.x(i).toFixed(1) + ',' + f.y(v).toFixed(1)).join('');

function drawSpaghetti(){

  const f = monthFrame(host, {yMin: 0, yMax: Math.max(...all), height: narrow ? 320 : 400, label: t('m_spag_t')});
  const g = S('g', {}, f.svg);
  ranked.forEach(s => { s._p = S('path', {d: pathD(f, s.pred), class: 'sp sp-' + s.peak}, g); });
  S('path', {d: pathD(f, ensMed), class: 'med-line'}, f.svg);

function badgesOf(s){
  const b = [];
  if (s.r.rmse === 1) b.push(['gold', 'b_champ']); else if (s.r.rmse <= 3) b.push(['gold', 'b_podium']); else if (s.r.rmse <= 10) b.push(['gold', 'b_top10']);
  if (bestSpike.includes(s)) b.push(['feb', 'b_spike']);
  if (bestCalm.includes(s)) b.push(['mar', 'b_calm']);
  if (s.m.rmse < REF.bench.m.rmse) b.push(['bench', 'b_bench']);
  if (s.m.rmse < REF.snaive.m.rmse) b.push(['good', 'b_snaive']);
  if (s.m.rmse < REF.median.m.rmse) b.push(['good', 'b_crowd']);
  if (s.peak === 'feb') b.push(['feb', 'b_feb']);
  return b;
}

    <div class="fileinfo"><div>${t('p_file')}: <span class="fn">${esc(s.file || '–')}</span>${s.support.includes('r') ? ` <span class="chip plain">${t('sup_r')}</span>` : ''}</div><div>${t('p_uploaded', {t: upTime(s.uploaded)})}</div>${notes}</div>`;
  const med = k => median(ranked.map(o => o.m[k]));
  const row = (cls, name, hint, val, rk, cm) => `<tr class="${cls}"><td class="l">${name}<span class="h">${hint}</span></td><td class="v">${val}</td><td>${rk}</td><td>${cm}</td></tr>`;
  $('#profMetrics').innerHTML = `<thead><tr><th class="l">${t('col_metric')}</th><th>${t('col_value')}</th><th>${t('col_rankm')}</th><th>${t('col_cmed')}</th></tr></thead><tbody>`
    + row('official', 'RMSE', t('m_rmse'), fmt(s.m.rmse), t('rank_of', {r: (s.tied ? '=' : '') + s.r.rmse, n: NR}), fmt(med('rmse')))
    + row('', 'MAE', t('m_mae'), fmt(s.m.mae), t('rank_of', {r: s.r.mae, n: NR}), fmt(med('mae')))
    + row('', 'MAPE', t('m_mape'), fmt(s.m.mape, 2) + '%', t('rank_of', {r: s.r.mape, n: NR}), fmt(med('mape'), 2) + '%')
    + row('', 'sMAPE', t('m_smape'), fmt(s.m.smape, 2) + '%', t('rank_of', {r: s.r.smape, n: NR}), fmt(med('smape'), 2) + '%')
    + row('', 'MASE', t('m_mase', {s: fmt(D.maseScale, 2)}), fmt(s.m.mae / D.maseScale), t('rank_of', {r: s.r.mae, n: NR}), fmt(med('mae') / D.maseScale))
    + row('', t('m_bias'), t('m_bias_h'), fmtSigned(s.m.bias, 3), '–', fmtSigned(med('bias'), 3))
    + row('sep', t('m_feb'), t('act_is', {v: fmt(A[1], 0)}), fmt(s.pred[1], 2), '–', fmt(median(ranked.map(o => o.pred[1])), 2))
    + row('', t('m_mar'), t('act_is', {v: fmt(A[2], 0)}), fmt(s.pred[2], 2), '–', fmt(median(ranked.map(o => o.pred[2])), 2))
    + row('', t('m_peak'), t('act_is', {v: mL(ACT_PEAK)}), `<span class="chip ${s.peak}">${mL(s.peakIdx)}</span>`, '–', `<span class="chip ${REF.median.peak}">${mL(REF.median.peakIdx)}</span>`)
    + '</tbody>';
  $('#plLegend').innerHTML = legendHTML([['', 'background:var(--ink);height:4px', t('lg_actual')], ['', `background:${GCOL[s.peak]};height:4px`, t('forecast')], ['dash', '', t('lg_median')], ['band', '', t('ramadan')]]);
  $('#peLegend').innerHTML = legendHTML([['dot', 'background:var(--under);border-radius:3px', t('too_low')], ['dot', 'background:var(--over);border-radius:3px', t('too_high')]]);
}
function drawProfLine(){
  const s = cur, host = $('#pline'), all = s.pred.concat(A, ensMed);
  const f = monthFrame(host, {yMin: 0, yMax: Math.max(...all), height: 330, label: t('p_ln_t')});
  S('path', {d: pathD(f, ensMed), class: 'med-line'}, f.svg);
  S('path', {d: pathD(f, A), class: 'act-line'}, f.svg);
  A.forEach((v, i) => S('circle', {cx: f.x(i), cy: f.y(v), r: 4.5, class: 'act-dot'}, f.svg));
  S('path', {d: pathD(f, s.pred), class: 'hl-line', style: `stroke:${GCOL[s.peak]}`}, f.svg);
  s.pred.forEach((v, i) => S('circle', {cx: f.x(i), cy: f.y(v), r: 4.5, class: 'hl-dot', style: `fill:${GCOL[s.peak]}`}, f.svg));
  const cross = S('line', {y1: f.m.t, y2: f.m.t + f.ih, class: 'cross', visibility: 'hidden'}, f.svg);
  const ov = S('rect', {x: f.m.l, y: f.m.t, width: f.iw, height: f.ih, fill: 'transparent'}, f.svg);
  const move = ev => { const pt = svgPoint(f.svg, ev, f.W), i = clamp(Math.floor((pt.x - f.m.l) / f.bw), 0, N - 1);
    cross.setAttribute('x1', f.x(i)); cross.setAttribute('x2', f.x(i)); cross.setAttribute('visibility', 'visible');
    showTip(`<b>${mL(i)} 2026</b><br><span class="sw" style="background:#fff"></span>${t('actual')} ${fmt(A[i], 0)}<br><span class="sw" style="background:${GCOL[s.peak]}"></span>${t('forecast')} ${fmt(s.pred[i], 2)}<br><span class="sw" style="background:#9AA6BA"></span>${t('class_median')} ${fmt(ensMed[i], 2)}<br><span class="m">${t('error')} ${fmtSigned(s.pred[i] - A[i], 2)}</span>`, ev); };
  ov.addEventListener('pointermove', move); ov.addEventListener('pointerdown', move);
  ov.addEventListener('pointerleave', () => { hideTip(); cross.setAttribute('visibility', 'hidden'); });
}
function drawProfErr(){
  const s = cur, host = $('#perr'), e = s.pred.map((v, i) => v - A[i]);
  const f = monthFrame(host, {yMin: Math.min(0, ...e), yMax: Math.max(0, ...e, 1), zero: true, height: 330, label: t('p_er_t')});
  const w = Math.min(34, f.bw * .58);
  e.forEach((v, i) => {
    const y0 = f.y(0), y1 = f.y(v), h = Math.max(1, Math.abs(y1 - y0));
    const b = S('rect', {x: f.x(i) - w/2, y: Math.min(y0, y1), width: w, height: h, rx: 3, class: v >= 0 ? 'bar-over' : 'bar-under'}, f.svg);
    const lab = T(f.svg, f.x(i), v >= 0 ? y1 - 6 : y1 + 15, fmtSigned(v, 1), null, 'middle'); lab.style.fontSize = '11px'; lab.style.fontWeight = '700';
    const tipf = ev => showTip(`<b>${mL(i)} 2026</b><br>${t('error')} ${fmtSigned(v, 2)}<br><span class="m">${t('forecast')} ${fmt(s.pred[i], 2)}, ${t('actual')} ${fmt(A[i], 0)}</span>`, ev);
    b.addEventListener('pointerenter', tipf); b.addEventListener('pointermove', tipf); b.addEventListener('pointerleave', hideTip);
  });
}
$('#profSel').addEventListener('change', e => { cur = students[+e.target.value]; renderProfile(); drawProfLine(); drawProfErr(); });

/* ---------------- submissions ---------------- */
let query2 = '';
function renderSubs(){
  const cnt = {valid: 0, notes: 0, review: 0, invalid: 0}; students.forEach(s => cnt[statusOf(s)]++);
  const notesTotal = cnt.notes + cnt.review;
  $('#subStats').innerHTML = [
    ['', ICON.file, 's_files', D.filesFound, t('s_files_s')],
    ['ok', ICON.check, 's_valid', cnt.valid, t('s_valid_s')],
    ['note', ICON.info, 's_notes', notesTotal, t('s_notes_s', {k: cnt.review})],
    ['bad', ICON.x, 's_invalid', cnt.invalid, t('s_invalid_s')],
    ['', ICON.users, 's_ranked', `${NR}/${students.length}`, t('s_ranked_s')]
  ].map(([c, ic, k, v, sub]) => `<div class="stat ${c}"><div class="k">${ic}${t(k)}</div><b class="tnum">${v}</b><div class="s">${sub}</div></div>`).join('');
  $('#rules').innerHTML = `<p>${t('s_rules_1')}</p><p>${t('s_rules_2')}</p><p>${t('s_rules_3')}</p>`;
  const order = {invalid: 0, review: 1, notes: 2, valid: 3};
  const q = query2.trim().toLowerCase();
  const rows = students.filter(s => !q || s.name.toLowerCase().includes(q) || (s.nrp || '').includes(q))
    .sort((a, b) => order[statusOf(a)] - order[statusOf(b)] || b.notes.length - a.notes.length || a.name.localeCompare(b.name));
  const chip = st => st === 'valid' ? `<span class="chip good">${t('st_valid')}</span>` : st === 'notes' ? `<span class="chip warn">${t('st_notes')}</span>` : st === 'review' ? `<span class="chip bad">${t('st_review')}</span>` : `<span class="chip bad">${t('st_invalid')}</span>`;
  const fname = f => esc(f || '–').replace(/_/g, '_<wbr>');
  $('#subTbl').innerHTML = `<thead><tr><th>${t('col_student')}</th><th>${t('col_upload')}</th><th>${t('col_status')}</th><th>${t('col_notes')}</th></tr></thead><tbody>`
    + (rows.map(s => `<tr><td><button class="n" type="button" data-prof="${s.idx}">${esc(s.name)}</button><div class="id">${esc(s.nrp || '–')}</div><div class="fn">${fname(s.file)}</div>${s.support.includes('r') ? `<span class="chip plain" style="margin-top:6px">${t('sup_r')}</span>` : ''}</td>
      <td class="tnum" style="white-space:nowrap">${upTime(s.uploaded)}</td><td>${chip(statusOf(s))}</td>
      <td>${s.notes.length ? `<ul>${s.notes.map(n => `<li class="${n.sev === 'warn' || n.sev === 'error' ? 'warn' : ''}">${noteHTML(n)}</li>`).join('')}</ul>` : '<span class="none">–</span>'}</td></tr>`).join('')
      || `<tr><td colspan="4" class="empty">${esc(t('no_match', {q: query2.trim()}))}</td></tr>`) + '</tbody>';
  const nameBtn = s => `<button type="button" data-prof="${s.idx}">${esc(s.name)}</button> <span class="id">(${esc(s.nrp)})</span>`;
  $('#ident').innerHTML = `<p>${t('s_id_h')}</p>` + (identical.length ? identical.map(g => `<div class="grp"><div class="hd">${t('s_id_k', {k: g.members.length})}</div>
      <div class="meta">${t('s_id_meta', {v: fmt(g.rmse), d: g.d < 1e-4 ? '< ' + fmt(0.0001, 4) : fmt(g.d, 4)})}</div><div class="names">${g.members.map(s => `<div>${nameBtn(s)}</div>`).join('')}</div></div>`).join('') : `<p>${t('s_id_none')}</p>`)
    + (partial.length ? `<div class="subh">${t('s_part_t')}</div>` + partial.map(p => `<div class="grp"><div class="meta" style="margin-top:0">${t('s_part_meta', {k: p.same, months: p.diffIdx.map(mL).join(', ')})}</div><div class="names"><div>${nameBtn(p.a)}</div><div>${nameBtn(p.b)}</div></div></div>`).join('') : '');
}
$('#q2').addEventListener('input', e => { query2 = e.target.value; renderSubs(); });

/* ---------------- tabs, language, wiring ---------------- */
const TABS = ['leaderboard', 'months', 'compare', 'benchmark', 'profiles', 'submissions'];
let current = 'leaderboard';
function drawCharts(tab){
  hideTip();
  if (tab === 'months'){ drawSpaghetti(); drawBox(); }
  else if (tab === 'compare'){ drawScatter(); drawSwarm(); }
  else if (tab === 'benchmark'){ drawBenchLines(); drawHistory(); }
  else if (tab === 'profiles'){ drawProfLine(); drawProfErr(); }
}
function showTab(id, keepScroll){
  if (!TABS.includes(id)) id = 'leaderboard';
  current = id;
  TABS.forEach(k => { $('#view-' + k).hidden = k !== id; $('#t-' + k).setAttribute('aria-selected', String(k === id)); $('#t-' + k).tabIndex = k === id ? 0 : -1; });
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  if (!keepScroll) scrollTo({top: 0});
  requestAnimationFrame(() => drawCharts(id));
}
function openProfile(idx){ cur = students[idx]; renderProfile(); showTab('profiles'); }
$$('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$('.tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TABS.indexOf(current), j = (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
  showTab(TABS[j], true); $('#t-' + TABS[j]).focus();
});
document.addEventListener('click', e => { const b = e.target.closest('[data-prof]'); if (b){ e.preventDefault(); openProfile(+b.dataset.prof); } });
$$('.lang button[data-lang]').forEach(b => b.addEventListener('click', () => { if (lang !== b.dataset.lang){ lang = b.dataset.lang; renderAll(); } }));
function applyStatic(){
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); e.setAttribute('aria-label', t(e.dataset.i18nPh)); });
  $$('.lang button[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $$('.theme button').forEach(b => { const k = b.dataset.themeSet === 'dark' ? 'theme_dark' : 'theme_light'; b.title = t(k); b.setAttribute('aria-label', t(k)); });
  $('.theme').setAttribute('aria-label', t('theme_t'));
  $('.tabs').setAttribute('aria-label', lang === 'id' ? 'Bagian dashboard' : 'Dashboard sections');
  const gen = new Date(D.generated + 'T12:00:00Z').toLocaleDateString(loc(), {day: 'numeric', month: 'long', year: 'numeric'});
  $('#foot').textContent = t('foot', {f: D.filesFound, d: gen});
}
function renderAll(){ applyStatic(); renderHero(); renderHighlights(); renderRanking(); renderMonthsStatic(); renderCompareStatic(); renderBenchStatic(); renderProfile(); renderSubs(); drawCharts(current); }
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => drawCharts(current), 140); });
$$('.theme button').forEach(b => b.addEventListener('click', () => {
  const th = b.dataset.themeSet; if (document.documentElement.dataset.theme === th) return;
  document.documentElement.dataset.theme = th;
  $$('.theme button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.themeSet === th)));
  renderMonthsStatic(); renderBenchStatic(); drawCharts(current);
}));

/* ---------------- celebration ---------------- */
$('#celebrate').addEventListener('click', () => {
  const champ = $('.pod.p1');
  if (champ){ champ.classList.remove('glow'); void champ.offsetWidth; champ.classList.add('glow'); }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.display = 'block'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const o = champ ? champ.querySelector('.av').getBoundingClientRect() : {left: innerWidth / 2, top: innerHeight / 3, width: 0, height: 0};
  const ox = o.left + o.width / 2, oy = o.top + o.height / 2, cols = ['#E6B53D', '#F3D37E', '#BAC3CF', '#C4895A', '#FFFFFF', '#7B5CC4', '#2F6DB0'];
  const moon = new Path2D(crescentD(0, 0, 7));
  const P = Array.from({length: 180}, (_, i) => { const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.3, sp = 5 + Math.random() * 10;
    return {x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .2 + Math.random() * .14, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .32, w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, c: cols[i % cols.length], sh: i % 6 === 0 ? 'moon' : i % 3 === 0 ? 'dot' : 'rect'}; });
  const t0 = performance.now(), DUR = 3300;
  (function frame(now){
    const el = now - t0, fade = el > DUR - 800 ? Math.max(0, (DUR - el) / 800) : 1;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.sh === 'rect') ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); else if (p.sh === 'dot'){ ctx.beginPath(); ctx.arc(0, 0, p.h / 1.5, 0, 6.283); ctx.fill(); } else { ctx.scale(p.w / 10, p.w / 10); ctx.fill(moon); }
      ctx.restore(); });
    if (el < DUR) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.style.display = 'none'; }
  })(t0);
});

/* ---------------- boot ---------------- */
$('#logoMoon').setAttribute('d', crescentD(17, 22.5, 6));
$$('.moon-path').forEach(p => p.setAttribute('d', crescentD(0, 0, 8.5)));
renderAll();
showTab((location.hash || '').slice(1) || 'leaderboard', true);
addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (h && h !== current) showTab(h, true); });
})();
